name: Verify and package

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# macOS packaging minutes bill at ten times the Linux rate. Never let two runs
# of the same ref package at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Frontend and Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Rust advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: bun run check:advisories

      - name: Check product identity
        run: bun run check:identity

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          }

      - name: Check meeting specifications and traceability
        run: bun run check:meetings

      - name: Test frontend
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Check documentation
        run: bun run docs:check

      - name: Check Tauri command sync
        run: bun run check:commands

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  package-macos:
    name: Sign and notarize macOS arm64
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: macos-14
    timeout-minutes: 120
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MIMIR_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.MIMIR_GOOGLE_OAUTH_CLIENT_ID }}
      MIMIR_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.MIMIR_GOOGLE_OAUTH_CLIENT_SECRET }}
      MIMIR_SLACK_CLIENT_ID: ${{ secrets.MIMIR_SLACK_CLIENT_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Signing, notarization, and the Scribe native toolchain are the failure
      # modes that only appear on a runner. Prove them before the long build.
      - name: Check packaging preconditions
        run: |
          missing=()
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            MIMIR_GOOGLE_OAUTH_CLIENT_ID MIMIR_GOOGLE_OAUTH_CLIENT_SECRET \
            MIMIR_SLACK_CLIENT_ID \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!key}" ] || missing+=("$key")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "missing repository secrets: ${missing[*]}" >&2
            exit 1
          fi
          test "$(uname -m)" = arm64 || { echo "packaging requires an arm64 runner" >&2; exit 1; }
          command -v cmake >/dev/null || brew install cmake
          cmake --version
          xcrun --find clang
          xcrun --find notarytool
          test -z "$(git status --porcelain=v1 --untracked-files=all)" \
            || { echo "checkout is not a clean release source" >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop bundle
        run: bun tauri build --target aarch64-apple-darwin

      - name: Verify source-bound release staging
        run: node scripts/check-release-stage.mjs --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: mimir-macos-arm64
          path: src-tauri/target/release-artifacts
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package-macos
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mimir-macos-arm64
          path: release-artifacts

      - name: Validate release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          directory=release-artifacts
          installer="$directory/Mimir_${version}_aarch64.dmg"
          updater="$directory/Mimir_${version}_aarch64.app.tar.gz"
          signature="$updater.sig"
          manifest="$directory/Mimir_${version}_aarch64.manifest.json"
          feed="$directory/latest.json"

          test "$(find "$directory" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8
          test -f "$installer"
          test -f "$updater"
          test -f "$signature"
          test -f "$manifest"
          test -f "$feed"
          test -f "$directory/SBOM.spdx.json"
          test -f "$directory/THIRD_PARTY_LICENSES.md"
          test -f "$directory/THIRD_PARTY_NOTICES.md"
          test "$(jq -r .version "$feed")" = "$version"
          test "$(jq -r '.platforms["darwin-aarch64"].signature' "$feed")" = "$(tr -d '\n' < "$signature")"
          test "$(jq -r '.updater.archive.file' "$manifest")" = "$(basename "$updater")"
          test "$(jq -r '.source.gitCommit' "$manifest")" = "$GITHUB_SHA"

      - name: Create complete draft release
        run: |
          stale_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft) | .id" | head -n 1)
          if [ -n "$stale_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$stale_id" --method DELETE
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "published release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Mimir $GITHUB_REF_NAME" \
            --generate-notes

      - name: Validate draft assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          test "$(printf '%s\n' "$assets" | sed '/^$/d' | wc -l | tr -d ' ')" = 8
          printf '%s\n' "$assets" | grep -Fx "Mimir_${version}_aarch64.dmg"
          printf '%s\n' "$assets" | grep -Fx "Mimir_${version}_aarch64.app.tar.gz"
          printf '%s\n' "$assets" | grep -Fx latest.json

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Check public updater feed
        run: |
          version="${GITHUB_REF_NAME#v}"
          feed_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          updater_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Mimir_${version}_aarch64.app.tar.gz"
          ready=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$feed_url" --output published-latest.json \
              && [ "$(jq -r .version published-latest.json)" = "$version" ]; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          test "$(jq -r '.platforms["darwin-aarch64"].url' published-latest.json)" = "$updater_url"
          curl --fail --silent --show-error --location --head "$updater_url" >/dev/null

  package-linux:
    # Parked: change this to `github.event_name == 'workflow_dispatch'` when
    # Linux distribution becomes useful.
    name: Package Linux x64 (parked)
    if: ${{ false }}
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux bundles
        run: bun tauri build --bundles appimage,deb

      - uses: actions/upload-artifact@v4
        with:
          name: mimir-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
