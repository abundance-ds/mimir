name: Build & Release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        type: string
        default: "default"

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            args: ""
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Setup .NET (Windows/Linux)
        if: runner.os != 'macOS'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Build docx-worker sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet publish sidecar/docx-worker/DocxWorker/DocxWorker.csproj \
            -r win-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -o src-tauri/binaries/
          mv src-tauri/binaries/DocxWorker.exe src-tauri/binaries/docx-worker-x86_64-pc-windows-msvc.exe

      - name: Build docx-worker sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          dotnet publish sidecar/docx-worker/DocxWorker/DocxWorker.csproj \
            -r linux-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -o src-tauri/binaries/
          mv src-tauri/binaries/DocxWorker src-tauri/binaries/docx-worker-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/docx-worker-x86_64-unknown-linux-gnu

      - name: Download typst (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TYPST_VERSION: "0.13.1"
        run: |
          curl -L "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-pc-windows-msvc.zip" -o typst.zip
          unzip typst.zip
          cp typst-x86_64-pc-windows-msvc/typst.exe src-tauri/binaries/typst-x86_64-pc-windows-msvc.exe

      - name: Download typst (Linux)
        if: runner.os == 'Linux'
        env:
          TYPST_VERSION: "0.13.1"
        run: |
          curl -L "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ --strip-components=1
          cp typst src-tauri/binaries/typst-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/typst-x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Prepare profile
        run: bash scripts/prepare-profile.sh ${{ inputs.profile }}

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          includeUpdaterJson: true

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
