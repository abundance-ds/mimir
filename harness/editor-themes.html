<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>editor themes harness</title>
  <style>
    html, body { margin: 0; height: 100%; }

    /* ---- Grid page (no ?theme) ---- */
    #app {
      display: none;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .grid-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 8px 16px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex: 0 0 auto;
    }
    .grid-control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .grid-control select {
      font-size: 13px;
      padding: 2px 4px;
    }
    .grid-container {
      flex: 1 1 auto;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
    }
    @media (max-width: 1200px) {
      .grid-container { grid-template-columns: 1fr; }
    }
    .grid-cell {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .grid-caption {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      background: #e8e8e8;
      border-radius: 4px 4px 0 0;
    }
    .grid-iframe {
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 4px 4px;
      width: 100%;
      min-width: 560px;
      min-height: 720px;
      flex: 1 1 auto;
    }

    /* ---- Cell page (?theme=...) ---- */
    #editor-root {
      display: none;
      height: 100vh;
      overflow: auto;
      background: var(--editor-paper, var(--color-chrome, #fff));
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="editor-root"></div>
  <script type="module">
    const params = new URLSearchParams(location.search)
    if (params.get('theme')) {
      document.getElementById('editor-root').style.display = 'block'
    } else {
      document.getElementById('app').style.display = 'flex'
    }
  </script>
  <script type="module" src="./editor-themes.js"></script>
</body>
</html>
