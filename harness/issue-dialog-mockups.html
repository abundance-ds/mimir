<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issue dialog — three variants</title>
<style>
  :root{color-scheme:light;--page:#e9ebef;--surface:#fff;--ink:#242830;--muted:#626976;--rule:#e1e4ea;--hover:#f1f3f7;--accent:#485cca;--soft:#eef0fc}
  *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:0;background:none}button:hover{background:var(--hover)}
  .switcher{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;padding:28px 16px 0}.switcher button{padding:7px 13px;border-radius:5px;color:var(--muted)}.switcher button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #00000012}.caption{text-align:center;margin:12px 20px 0;color:var(--muted);font-size:12px}
  main{padding:58px 20px 30px;display:flex;justify-content:center}.dialog{width:580px;max-width:100%;background:var(--surface);border:1px solid #cdd1da;border-radius:9px;box-shadow:0 18px 60px #24283016;overflow:hidden}.dialog.side{width:680px}header{height:48px;display:flex;align-items:center;gap:10px;padding:0 20px}h1{font-size:12px;font-weight:600;margin:0;color:var(--muted)}.close{margin-left:auto;width:28px;height:28px;font-size:21px;color:var(--muted);border-radius:4px}.writing{padding:6px 22px 16px}.title{display:block;width:100%;border:0;background:transparent;font-size:19px;line-height:1.4;font-weight:600;resize:none;overflow:hidden;padding:0;margin:0 0 14px}.description{display:block;width:100%;min-height:116px;border:0;background:transparent;resize:vertical;padding:0;font-size:13px;line-height:1.75}.description::placeholder,.title::placeholder{color:var(--muted)}
  .properties{display:flex;flex-wrap:wrap;gap:5px;padding:0 20px 18px}.property{display:inline-flex;align-items:center;gap:6px;min-height:29px;padding:4px 8px;border:1px solid var(--rule);border-radius:4px;white-space:nowrap;font-size:12px;max-width:100%}.property .value{overflow:hidden;text-overflow:ellipsis}.property svg{width:14px;height:14px;flex:none;color:var(--muted)}.chevron{font-size:10px;color:var(--muted);margin-left:2px}.property[aria-expanded=true]{background:var(--soft);border-color:var(--accent)}footer{border-top:1px solid var(--rule);padding:12px 18px;display:flex;align-items:center;gap:12px}.storage{border:0;padding-left:3px;color:var(--muted)}.create{background:var(--accent);color:#fff;border-radius:5px;padding:7px 12px;display:flex;align-items:center;gap:16px;margin-left:auto;font-weight:500}.create:hover{background:#3b4eaf}.create kbd{font:11px -apple-system,BlinkMacSystemFont,sans-serif;opacity:.8}.create:disabled{opacity:.5;cursor:default}
  .project-top header{border-bottom:1px solid var(--rule);margin-bottom:15px}.project-top header .property{border:0;background:var(--hover)}.project-top .description{min-height:130px}.side .body{display:grid;grid-template-columns:minmax(0,1fr) 165px}.side .writing{padding-right:24px}.side .properties{border-left:1px solid var(--rule);padding:4px 12px 18px;display:flex;flex-direction:column;gap:7px;align-items:stretch}.side .property{border-color:transparent;justify-content:flex-start}.side .property .chevron{margin-left:auto}.side .description{min-height:150px}
  .menu{position:fixed;z-index:5;width:230px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 28px #24283022;padding:6px;max-height:280px;overflow:auto}.menu[hidden]{display:none}.menu-label{font-size:11px;font-weight:600;color:var(--muted);padding:4px 7px 7px}.search{width:100%;border:1px solid var(--rule);border-radius:3px;padding:6px 8px;margin-bottom:5px;background:var(--surface)}.option{width:100%;text-align:left;padding:6px 8px;border-radius:3px;display:flex;justify-content:space-between}.option[aria-selected=true]{background:var(--soft)}.empty{padding:8px;color:var(--muted)}.help{text-align:center;font-size:12px;color:var(--muted);margin:0 20px}.feedback{min-height:25px;text-align:center;margin:12px 20px;color:var(--accent)}.reopen{display:block;margin:0 auto;padding:8px 14px;background:var(--surface);border-radius:4px}.reopen[hidden]{display:none}
  @media(max-width:560px){main{padding:30px 12px 22px}.side .body{display:block}.side .properties{border-left:0;flex-direction:row;flex-wrap:wrap;padding:0 20px 18px}.side .property{border-color:var(--rule)}.title{font-size:17px}header{padding:0 16px}.writing{padding-left:18px;padding-right:18px}.switcher{padding-top:18px}.switcher button{padding:6px 9px}.create{gap:9px}}
</style>
<nav class="switcher" aria-label="Dialog variant">
  <button data-variant="bottom" aria-pressed="true">A · Below the text</button>
  <button data-variant="project-top" aria-pressed="false">B · Project in header</button>
  <button data-variant="side" aria-pressed="false">C · Side column</button>
</nav>
<p class="caption" id="caption">Write first. All properties stay together below the description.</p>
<main>
  <section class="dialog" aria-label="New issue mockup">
    <header><h1>New issue</h1><div id="header-project"></div><button class="close" aria-label="Close dialog" title="Close dialog">×</button></header>
    <div class="body">
      <div class="writing">
        <textarea class="title" rows="1" aria-label="Issue title" placeholder="Issue title">Check utility inputs against the source study</textarea>
        <textarea class="description" aria-label="Issue description" placeholder="Add context, source links, or expected output…">Compare the model inputs with @Utility extraction.
Record each difference and its effect on the base case.</textarea>
      </div>
      <div class="properties" aria-label="Issue properties"></div>
    </div>
    <footer><div id="storage"></div><button class="create">Create <kbd>⌘ ↵</kbd></button></footer>
  </section>
</main>
<button class="reopen" hidden>Reopen dialog</button>
<p class="help">Edit the text. Click a property to change it. Switch variants to compare the same draft.</p>
<p class="feedback" role="status">Mockup only. No issue will be saved.</p>
<div class="menu" hidden></div>
<script>
const $=s=>document.querySelector(s);
const paths={project:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="13" y="3" width="6" height="6" rx="1"/><rect x="3" y="13" width="6" height="6" rx="1"/><rect x="13" y="13" width="6" height="6" rx="1"/>',status:'<circle cx="11" cy="11" r="8" stroke-dasharray="2 2"/>',owner:'<circle cx="11" cy="7" r="3"/><path d="M4 20v-3a7 7 0 0 1 14 0v3"/>',priority:'<path d="M5 18v-4m6 4V9m6 9V4" stroke-width="3"/>',due:'<rect x="3" y="5" width="16" height="15" rx="2"/><path d="M7 2v6m8-6v6M3 11h16"/>',storage:'<path d="M3 8h16v12H3zM6 8V3h10v5"/>'};
const fields={project:{label:'Project',value:'Atlas',options:['Atlas','Evidence synthesis','Oncology model','Internal methods','No project'],search:true},status:{label:'Status',value:'Backlog',options:['Backlog','Planned','In progress','Waiting','In review','Done']},owner:{label:'Owner',value:'Assign',options:['Assign','Jon','Anna','You'],search:true},priority:{label:'Priority',value:'Normal',options:['Urgent','High','Normal','Low']},due:{label:'Due date',value:'Due date',options:['Due date','Today','Tomorrow','25 Sep','30 Sep']},storage:{label:'Storage',value:'Team',options:['Team','Private','Workspace']}};
let variant='bottom',activeButton=null;
const captions={bottom:'Write first. All properties stay together below the description.','project-top':'Check the project at the top. Keep task properties below the description.',side:'Keep the writing area and properties side by side.'};
function control(key){const f=fields[key],b=document.createElement('button');b.className='property'+(key==='storage'?' storage':'');b.dataset.field=key;b.setAttribute('aria-label',f.label+': '+f.value);b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');b.title='Change '+f.label.toLowerCase();b.innerHTML='<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'+paths[key]+'</svg><span class="value"></span><span class="chevron" aria-hidden="true">⌄</span>';b.querySelector('.value').textContent=key==='storage'?'Save to '+f.value:f.value;b.onclick=()=>openMenu(b,key);return b}
function render(){closeMenu();$('.dialog').className='dialog '+variant;$('.properties').replaceChildren();$('#header-project').replaceChildren();for(const key of ['project','status','owner','priority','due']){(key==='project'&&variant==='project-top'?$('#header-project'):$('.properties')).append(control(key))}$('#storage').replaceChildren(control('storage'));$('#caption').textContent=captions[variant];document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));resizeTitle()}
function closeMenu(focus=false){$('.menu').hidden=true;if(activeButton){activeButton.setAttribute('aria-expanded','false');if(focus)activeButton.focus()}activeButton=null}
function openMenu(button,key){if(activeButton===button){closeMenu(true);return}closeMenu();activeButton=button;button.setAttribute('aria-expanded','true');const f=fields[key],menu=$('.menu');menu.replaceChildren();const label=document.createElement('div');label.className='menu-label';label.textContent=f.label;menu.append(label);let search;if(f.search){search=document.createElement('input');search.className='search';search.placeholder='Find '+(key==='project'?'a project':'a person');search.setAttribute('aria-label',search.placeholder);menu.append(search)}const list=document.createElement('div');list.setAttribute('role','listbox');list.setAttribute('aria-label',f.label);menu.append(list);function options(query=''){list.replaceChildren();const matches=f.options.filter(x=>x.toLowerCase().includes(query.toLowerCase()));for(const value of matches){const b=document.createElement('button');b.className='option';b.setAttribute('role','option');b.setAttribute('aria-selected',String(value===f.value));b.textContent=value+(value===f.value?'  ✓':'');b.onclick=()=>{f.value=value;render();document.querySelector('[data-field="'+key+'"]').focus()};list.append(b)}if(!matches.length){const p=document.createElement('div');p.className='empty';p.textContent='No matches';list.append(p)}}options();if(search)search.oninput=()=>options(search.value);menu.hidden=false;const rect=button.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(rect.left,innerWidth-238))+'px';menu.style.top=Math.max(8,rect.bottom+6+menu.offsetHeight>innerHeight?rect.top-menu.offsetHeight-6:rect.bottom+6)+'px';(search||list.querySelector('[aria-selected=true]')||list.firstElementChild).focus()}
$('.menu').addEventListener('keydown',e=>{const options=[...$('.menu').querySelectorAll('.option')],index=options.indexOf(document.activeElement);if(e.key==='Escape'){e.preventDefault();closeMenu(true)}else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)&&options.length){e.preventDefault();let next=e.key==='Home'?0:e.key==='End'?options.length-1:e.key==='ArrowDown'?(index+1)%options.length:(index-1+options.length)%options.length;options[next].focus()}else if(e.key==='Tab')closeMenu()});
document.addEventListener('pointerdown',e=>{if(!$('.menu').contains(e.target)&&!e.target.closest('.property'))closeMenu()});
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;render()});
function resizeTitle(){const t=$('.title');t.style.height='auto';t.style.height=t.scrollHeight+'px'}
$('.title').addEventListener('input',()=>{resizeTitle();$('.create').disabled=!$('.title').value.trim()});
function create(){if(!$('.title').value.trim())return;closeMenu();$('.feedback').textContent='Preview: “'+$('.title').value.trim()+'” — '+fields.project.value+', '+fields.status.value+'. Nothing was saved.'}
$('.create').onclick=create;document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!$('.dialog').hidden){e.preventDefault();create()}});
$('.close').onclick=()=>{closeMenu();$('.dialog').hidden=true;$('.reopen').hidden=false;$('.reopen').focus()};$('.reopen').onclick=()=>{$('.dialog').hidden=false;$('.reopen').hidden=true;resizeTitle();$('.title').focus()};window.addEventListener('resize',()=>{closeMenu();resizeTitle()});render();
</script>
</html>
