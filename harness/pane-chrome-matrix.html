<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Panel comparison</title>
<style>body{font:14px system-ui;margin:20px;background:#eee;color:#222}nav{position:sticky;top:0;background:#eee;padding:12px 0;z-index:1}label{margin-right:20px}iframe{display:block;border:1px solid #999;margin-bottom:28px}h2{font-size:15px}</style></head>
<body><h1>Panel comparison</h1><nav>
<label>Width <input id="width" type="number" min="600" max="2000" value="1360" step="100"></label>
<label>Theme <input id="theme" value="parchment"></label>
<label><input id="overflow" type="checkbox" checked> Many tabs</label>
<label><input id="empty" type="checkbox"> Empty Editor</label>
<button id="apply">Apply</button></nav><main></main>
<script type="module">
const states = ['expanded','rail'].flatMap(sidebar => [['expanded','expanded'],['rail','expanded'],['expanded','rail']].map(([activity,editor])=>({sidebar,activity,editor})))
function render(){
 document.querySelector('main').replaceChildren()
 for(const state of states){
  const title=document.createElement('h2');title.textContent=`Sidebar: ${state.sidebar} · Main: ${state.activity} · Editor: ${state.editor}`
  const frame=document.createElement('iframe');frame.title=title.textContent;frame.width=document.querySelector('#width').value;frame.height=440
  const query=new URLSearchParams({...state,tabs:document.querySelector('#overflow').checked?'24':'3',theme:document.querySelector('#theme').value})
  if(document.querySelector('#empty').checked)query.set('empty','')
  frame.src=`pane-chrome.html?${query}`;document.querySelector('main').append(title,frame)
 }
}
document.querySelector('#apply').addEventListener('click',render);render()
</script></body></html>
