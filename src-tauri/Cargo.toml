[package]
name = "mim-panel"
version = "0.0.1"
description = "A terminal-first editor panel for coding agents"
authors = ["Mim"]
edition = "2021"

[lib]
name = "shoulders_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "rt", "time", "net"] }
dirs = "5"
chrono = "0.4"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
pulldown-cmark = { version = "0.12", features = ["simd"] }
base64 = "0.22"
log = "0.4"
portable-pty = "0.8"
sha2 = "0.10"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults", "NSArray", "NSRange", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSSpellChecker", "NSPanel", "NSWindow", "NSResponder", "NSButton", "NSControl", "NSView", "NSEvent", "NSScreen"] }
objc2-core-foundation = "0.3"
