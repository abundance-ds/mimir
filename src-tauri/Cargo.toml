[package]
name = "mimir"
version = "0.1.0"
description = "A local AI-native workbench for CLI agents and reviewed files"
authors = ["Mimir"]
edition = "2021"

[lib]
name = "mimir"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "rt", "time", "net"] }
dirs = "5"
chrono = "0.4"
chrono-tz = "0.10"
cron = "0.17"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
log = "0.4"
portable-pty = "0.8"
sha2 = "0.10"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
ignore = "0.4"
notify = "8.2"
toml = "1"
trash = "5"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults", "NSArray", "NSRange", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSSpellChecker"] }
