[package]
name = "mimir-meeting-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Mimir-owned realtime meeting audio capture primitives"

[dependencies]
futures-util = "0.3.31"
ringbuf = "0.4.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.15", features = ["av"] }
cpal = "0.17"

[dev-dependencies]
futures-executor = "0.3.31"
proptest = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
