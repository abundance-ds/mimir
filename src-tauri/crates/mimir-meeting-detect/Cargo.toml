[package]
name = "mimir-meeting-detect"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Mimir-owned macOS meeting detection and consent primitives"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.15", features = ["av", "blocks", "dispatch"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
